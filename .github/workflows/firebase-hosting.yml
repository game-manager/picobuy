name: Deploy PicoBuy to Firebase Hosting

on:
  push:
    branches: [main, firebase-production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOUCHBRIDGE_NOZOMU_2026 }}
          projectId: touchbridge-nozomu-2026
          target: picobuy
          channelId: live
          firebaseToolsVersion: 15.24.0
